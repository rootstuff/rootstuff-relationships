<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#2271b1" />
			<stop offset="100%" stop-color="#1a5e95" />
		</linearGradient>
		<linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
		</linearGradient>
	</defs>
	<rect width="1544" height="500" fill="url(#bg)" />
	<!-- Decorative relationship graph on the right -->
	<g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2" fill="none">
		<path d="M970 130 C 1060 130, 1100 230, 1200 230" />
		<path d="M970 130 C 1080 130, 1120 330, 1240 330" />
		<path d="M1200 230 C 1300 230, 1340 330, 1240 330" />
		<path d="M1200 230 C 1300 230, 1360 130, 1430 200" />
		<path d="M1430 200 C 1460 280, 1380 350, 1240 330" />
	</g>
