		<circle cx="970" cy="130" r="20" />
		<circle cx="1200" cy="230" r="26" />
		<circle cx="1240" cy="330" r="22" />
		<circle cx="1430" cy="200" r="18" />
	</g>
	<g fill="#ffffff" fill-opacity="0.95">
		<circle cx="970" cy="130" r="8" />
		<circle cx="1200" cy="230" r="10" />
		<circle cx="1240" cy="330" r="8" />
		<circle cx="1430" cy="200" r="7" />
	</g>
	<!-- Brand mark on the left: minimal schema diagram, golden-ratio proportions -->
	<rect x="100" y="130" width="240" height="240" rx="44" ry="44" fill="url(#markBg)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

	<path d="M215 203 L264 203 L264 273"
	      stroke="#ffffff" stroke-width="7" fill="none"
	      stroke-linecap="round" stroke-linejoin="round"
	      stroke-opacity="0.75" />

	<rect x="137" y="179" width="78" height="48" rx="10" ry="10" fill="#ffffff" />
	<rect x="225" y="273" width="78" height="48" rx="10" ry="10" fill="#ffffff" />

	<circle cx="215" cy="203" r="5.5" fill="#1a5e95" />
	<circle cx="264" cy="273" r="5.5" fill="#1a5e95" />
	<!-- Title -->
	<text x="400" y="260" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="-2">Rootstuff Relationships</text>
	<!-- Tagline -->
	<text x="400" y="318" fill="#ffffff" fill-opacity="0.85" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400">A developer-first relationship layer for WordPress content modeling.</text>
